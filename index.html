<style>
/* colours */
:root{
  --cream:#FFF8E7;  --paper:#FFFDF5;  --sand:#F1E7C3;
  --pink:#FFCCD5;   --pink2:#F7A6B0;  --rose:#EF7C93;
  --mint:#7FD6A8;   --teal:#1FC9A8;   --teal-d:#17A88C;
  --brown:#5C4033;  --brown2:#8A7666; --text:#5A4030;
  --sky:#BFE9F2;    --sea:#7FD3E0;    --yellow:#F7D354;
  --orange:#F98E5E; --purple:#9184CC; --lilac:#C99BD6;
  --shadow:0 6px 0 rgba(92,64,51,.10), 0 16px 34px rgba(92,64,51,.12);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Nunito",system-ui,sans-serif;color:var(--text);background:var(--cream);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/*top bar*/
.topbar{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 18px;background:var(--pink);box-shadow:0 4px 0 rgba(239,124,147,.22)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;
  color:var(--brown);background:#FFE6EA;padding:7px 16px 7px 9px;border-radius:999px}
.brand svg{width:28px;height:28px;flex:none}
.sound{font:inherit;font-weight:800;font-size:.88rem;color:#fff;background:var(--teal);border:0;border-radius:999px;
  padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--teal-d);transition:transform .1s}
.sound:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.sound[aria-pressed="false"]{background:#C4B3A5;box-shadow:0 3px 0 #A3907F}
.sound:focus-visible{outline:3px solid var(--brown);outline-offset:3px}

/* hero / greeting*/
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:110px 16px 90px;background-color:var(--cream);
  background-image:radial-gradient(#FFD9E0 3px,transparent 3.5px);background-size:28px 28px}
.stage{display:flex;align-items:flex-end;gap:20px;width:100%;max-width:880px}
.guide{width:210px;flex:none;animation:squish 2.8s ease-in-out infinite;transform-origin:50% 100%}
.guide svg{display:block;width:100%;height:auto;overflow:visible}
.guide .m-open{display:none}
.guide.talk-o .m-open{display:inline}
.guide.talk-o .m-closed{display:none}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}

.bubble{position:relative;flex:1;display:block;text-align:left;font:inherit;color:inherit;cursor:pointer;border:0;
  background:var(--paper);padding:46px 42px 42px;margin-bottom:74px;
  border-radius:48px 54px 50px 42px / 46px 50px 54px 48px;box-shadow:var(--shadow);transition:transform .15s}
.bubble:hover{transform:translateY(-2px)}
.bubble:active{transform:scale(.99)}
.bubble:focus-visible{outline:4px solid var(--teal);outline-offset:5px}
.bubble::after{content:"";position:absolute;left:-24px;bottom:46px;width:0;height:0;
  border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:28px solid var(--paper)}
.nametag{position:absolute;top:-19px;left:34px;background:var(--orange);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;
  font-size:1.1rem;padding:6px 22px;border-radius:999px;transform:rotate(-5deg);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bubble-text{display:block;font-weight:800;font-size:clamp(1.12rem,2.4vw,1.45rem);line-height:1.55;min-height:4.65em;color:#6B4F3A}
.next{position:absolute;right:30px;bottom:16px;color:var(--orange);font-size:1.15rem;opacity:0;transition:opacity .2s;animation:nudge .8s ease-in-out infinite}
.next.show{opacity:1}
.to-map{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem;
  color:#fff;background:var(--teal);padding:13px 26px;border-radius:999px;box-shadow:0 4px 0 var(--teal-d);animation:hop 1.6s ease-in-out infinite}
.to-map[hidden]{display:none}
.to-map:focus-visible{outline:3px solid var(--brown);outline-offset:4px}
.scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-weight:800;font-size:.85rem;color:var(--brown2);
  text-align:center;letter-spacing:.08em;animation:nudge 1.4s ease-in-out infinite}

/* island map */
.island{padding:84px 16px 76px;text-align:center;background-color:var(--sand);
  background-image:radial-gradient(rgba(255,255,255,.75) 3px,transparent 3.5px);background-size:30px 30px}
.sign-title h1{display:inline-block;margin:0;font-size:clamp(1.55rem,4.6vw,2.6rem);color:var(--brown);background:var(--paper);
  padding:12px 34px;border-radius:999px;box-shadow:var(--shadow);border:4px solid #fff}
.sub{font-weight:800;color:var(--brown2);margin:18px 0 26px;font-size:1.05rem}
.map-frame{max-width:1060px;margin:0 auto;padding:14px;border-radius:36px;background-color:var(--brown2);
  background-image:radial-gradient(rgba(255,255,255,.18) 2.5px,transparent 3px);background-size:16px 16px;box-shadow:var(--shadow)}
.map-scroll{border-radius:24px;overflow:hidden}
.map-scroll svg{display:block;width:100%;height:auto;background:var(--sea)}
.swipe-hint{display:none;font-weight:800;color:var(--brown2);margin:12px 0 0}

.spot{cursor:pointer;outline:none}
.spot .bldg{transform-box:fill-box;transform-origin:50% 100%;transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
.spot:hover .bldg,.spot:focus-visible .bldg{transform:translateY(-7px) scale(1.06)}
.sign{animation:bob 3.2s ease-in-out infinite}
.sign rect{fill:var(--paper);stroke:var(--brown);stroke-width:2.5;transition:stroke .2s}
.sign text{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;fill:var(--brown)}
.spot:hover .sign rect,.spot:focus-visible .sign rect{stroke:var(--teal);stroke-width:4}
.badge{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .3s}
.spot.visited .badge{opacity:1;animation:popin .45s cubic-bezier(.3,1.7,.5,1)}
.flow{animation:flow 2.4s linear infinite}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.3s ease-in-out infinite alternate}
.cloud{animation:drift 14s ease-in-out infinite alternate}
.cloud.c2{animation-duration:18s;animation-delay:-5s}
.cloud.c3{animation-duration:16s;animation-delay:-9s}
.map-pip{animation:bob 2.2s ease-in-out infinite}

/* stamp rally */
.stamps{max-width:780px;margin:34px auto 0;background:var(--paper);border-radius:30px;padding:20px 22px 24px;box-shadow:var(--shadow)}
.stamps h2{margin:0 0 4px;font-size:1.3rem;color:var(--brown)}
.stamps p{margin:0 0 16px;font-weight:700;color:var(--brown2);font-size:.95rem}
.stamp-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed #D9CBB8;background:#FBF6EA;display:grid;place-items:center;padding:6px;
  font:600 .82rem/1.15 Fredoka,sans-serif;color:#B5A493;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .2s}
.stamp:hover{transform:scale(1.06)}
.stamp:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.stamp.got{border:3px solid #fff;background:var(--c);color:#fff;transform:rotate(-8deg);box-shadow:0 0 0 3px var(--c)}

/* popup  */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(92,64,51,.38);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-card{position:relative;width:min(640px,100%);max-height:min(86vh,780px);overflow:auto;border-radius:34px;
  background-color:var(--paper);background-image:radial-gradient(#F4ECDA 2.5px,transparent 3px);background-size:22px 22px;
  box-shadow:0 22px 60px rgba(92,64,51,.35);animation:pop .38s cubic-bezier(.3,1.5,.5,1)}
.modal-head{position:sticky;top:0;z-index:1;background:var(--c);color:#fff;padding:22px 76px 20px 28px}
.modal-tag{display:inline-block;background:rgba(255,255,255,.3);padding:3px 12px;border-radius:999px;font-weight:800;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase}
.modal-head h2{margin:6px 0 0;font-size:1.85rem;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.modal-close{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:var(--brown);
  font:700 1.5rem/1 Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.modal-close:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.modal-body{padding:24px 26px 30px}
.photo{margin:0 auto 20px;width:180px;height:180px;padding:8px;background:#fff;border-radius:50%;box-shadow:0 4px 0 rgba(92,64,51,.1),0 0 0 4px var(--c);transform:rotate(-3deg)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.lead{font-weight:700;font-size:1.08rem;line-height:1.6;margin:0 0 18px}
.entry{background:#fff;border-radius:22px;padding:16px 20px;margin-bottom:14px;box-shadow:0 3px 0 rgba(92,64,51,.08)}
.entry h3{margin:0;font-size:1.18rem;color:var(--brown)}
.entry p{margin:6px 0 0;line-height:1.55;font-weight:600}
.entry .meta{margin:2px 0 6px;font-weight:800;color:var(--brown2);font-size:.92rem}
.entry ul,.facts{margin:6px 0 0;padding-left:0;list-style:none}
.entry li,.facts li{position:relative;padding-left:22px;margin:6px 0;line-height:1.5;font-weight:600}
.entry li::before,.facts li::before{content:"✿";position:absolute;left:0;color:var(--c)}
.facts{background:#fff;border-radius:22px;padding:14px 20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tags span{background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--brown);font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px}
.tags.big span{font-size:.95rem;padding:7px 14px}
.group{margin:18px 0 0;font-size:1.05rem;color:var(--brown)}
.group:first-child{margin-top:0}
.pill-link{display:inline-block;margin-top:12px;text-decoration:none;font-weight:800;font-size:.9rem;color:#fff;background:var(--c);padding:7px 16px;border-radius:999px}
.links{display:grid;gap:10px}
.contact-link{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;text-decoration:none;background:#fff;
  border-radius:20px;padding:14px 18px;box-shadow:0 3px 0 rgba(92,64,51,.08);transition:transform .15s}
.contact-link:hover{transform:translateX(4px)}
.contact-link span{font-weight:800;color:var(--brown2)}
.contact-link strong{color:var(--brown);word-break:break-all}

/* toast + footer  */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;width:min(460px,calc(100% - 32px));background:var(--paper);
  border-radius:28px;padding:22px 24px 18px;box-shadow:0 14px 40px rgba(92,64,51,.3);font-weight:800;line-height:1.5;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.toast[hidden]{display:none}
.toast .nametag{top:-15px;left:24px;font-size:.95rem;padding:4px 16px}
footer{background:var(--pink);text-align:center;padding:34px 16px 38px;font-weight:800;color:var(--brown)}
footer p{margin:0 0 10px}
footer a{display:inline-block;text-decoration:none;background:#fff;padding:8px 18px;border-radius:999px;box-shadow:0 3px 0 rgba(239,124,147,.35)}

/* animations */
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.scroll-hint{animation-name:nudgeX}
@keyframes nudgeX{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}60%{transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes wave{from{transform:skewY(-6deg)}to{transform:skewY(8deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}

/* phones */
@media (max-width:720px){
  .stage{flex-direction:column-reverse;align-items:center;gap:8px}
  .guide{width:150px}
  .bubble{width:100%;margin-bottom:26px;padding:42px 26px 36px}
  .bubble::after{left:50%;bottom:-26px;transform:translateX(-50%);
    border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--paper);border-bottom:0}
  .map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .map-scroll svg{width:780px;max-width:none}
  .swipe-hint{display:block}
  .stamp-row{grid-template-columns:repeat(3,1fr)}
  .stamp{font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

  <a class="brand" href="#top">
    <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#F7A6B0"><circle cx="16" cy="8" r="6"/><circle cx="24" cy="14" r="6"/><circle cx="21" cy="24" r="6"/><circle cx="11" cy="24" r="6"/><circle cx="8" cy="14" r="6"/></g><circle cx="16" cy="17" r="5" fill="#F7D354"/></svg>
    <span id="brandName">Jana</span>

<!-- island map -->
<section class="island" id="island">
  <div class="sign-title"><h1 id="islandTitle">Welcome to Clover Island</h1></div>
  <p class="sub">Tap a building to take a peek inside!</p>

  <div class="map-frame">
    <div class="map-scroll" id="mapScroll">
      <svg viewBox="0 0 1000 700" role="img" aria-labelledby="mapTitle">
        <title id="mapTitle">Island map. Each building opens a section of my profile.</title>
        <defs>
          <pattern id="waves" width="90" height="46" patternUnits="userSpaceOnUse">
            <path d="M10 18 q8 -8 16 0 t16 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

          </pattern>
          <g id="tree">
            <ellipse cx="0" cy="2" rx="18" ry="5" fill="#5C4033" opacity=".14"/>
            <rect x="-5" y="-14" width="10" height="16" rx="3" fill="#A87554"/>
            <circle cx="-12" cy="-22" r="14" fill="#4E9E4C"/><circle cx="12" cy="-22" r="14" fill="#4E9E4C"/>
            <circle cx="0" cy="-32" r="20" fill="#5FAE58"/>
            <circle cx="-7" cy="-38" r="6" fill="#82C774"/>
            <circle cx="9" cy="-26" r="3.5" fill="#F98E5E"/><circle cx="-10" cy="-20" r="3.5" fill="#F98E5E"/>
          </g>
          <g id="pine">
            <ellipse cx="0" cy="2" rx="15" ry="4.5" fill="#5C4033" opacity=".14"/>
            <rect x="-4" y="-10" width="8" height="12" rx="2" fill="#A87554"/>
            <path d="M-20,-8 L0,-34 L20,-8 Z" fill="#3E8E5A"/>
            <path d="M-16,-24 L0,-50 L16,-24 Z" fill="#4CA068"/>
            <path d="M-11,-40 L0,-62 L11,-40 Z" fill="#5BB176"/>
          </g>
          <g id="flower">
            <circle cx="0" cy="-4" r="3.3"/><circle cx="3.8" cy="-1.2" r="3.3"/><circle cx="2.4" cy="3.2" r="3.3"/>
            <circle cx="-2.4" cy="3.2" r="3.3"/><circle cx="-3.8" cy="-1.2" r="3.3"/><circle r="2.3" fill="#F7D354"/>
          </g>
          <g id="cloudShape" fill="#fff" opacity=".92">
            <ellipse cx="0" cy="0" rx="42" ry="15"/><circle cx="-15" cy="-9" r="15"/><circle cx="12" cy="-13" r="19"/>

        <!-- sea -->
        <rect width="1000" height="700" fill="#7FD3E0"/>
        <rect width="1000" height="700" fill="url(#waves)"/>

        <!-- beach + grass -->
        <path d="M120,140 C180,60 380,50 520,70 C680,40 860,70 900,170 C950,280 930,420 900,500 C870,560 800,610 700,620 C560,650 380,650 250,630 C140,610 70,520 70,400 C60,300 70,210 120,140 Z"
              fill="#F4E4B0" stroke="#E5D199" stroke-width="5"/>
        <path d="M145,160 C200,90 390,80 520,95 C670,70 840,95 875,185 C915,285 900,415 875,485 C850,540 780,585 690,595 C560,620 390,622 260,605 C160,588 98,510 96,400 C90,305 98,225 145,160 Z" fill="#8FCB72"/>
        <path d="M145,160 C200,90 390,80 520,95 C670,70 840,95 875,185 C915,285 900,415 875,485 C850,540 780,585 690,595 C560,620 390,622 260,605 C160,588 98,510 96,400 C90,305 98,225 145,160 Z" fill="url(#grassdots)"/>

        <!-- river -->

        <path class="flow" d="M640,30 C618,140 692,198 662,282 C640,346 722,384 822,372 C880,366 930,360 1000,358" fill="none" stroke="#B5E9F0" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 28"/>

        <!-- dirt paths -->
        <g fill="none" stroke="#E9D7A0" stroke-width="18" stroke-linecap="round">
          <path d="M500,300 C420,300 300,272 200,262"/>
          <path d="M500,300 C580,300 690,252 790,246"/>
          <path d="M500,300 C430,360 320,450 240,482"/>
          <path d="M500,300 C520,380 545,430 560,492"/>
          <path d="M560,492 C620,540 720,572 770,602"/>
        </g>
        <ellipse cx="500" cy="300" rx="72" ry="32" fill="#E9D7A0"/>

        <!-- bridge -->
        <g transform="translate(667,263) rotate(-14)">

const ORDER = ["about", "experience", "projects", "skills", "education", "contact"];
const $ = (id) => document.getElementById(id);
const fill = (s) => s.replaceAll("{name}", CONFIG.name).replaceAll("{guide}", CONFIG.guideName).replaceAll("{island}", CONFIG.islandName);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/*  names everywhere */
document.title = `${CONFIG.name} · Island Profile`;
$("brandName").textContent = CONFIG.name;
$("guideName").textContent = CONFIG.guideName;
$("toastName").textContent = CONFIG.guideName;
$("islandTitle").textContent = `Welcome to ${CONFIG.islandName}`;
$("footerText").textContent = `Hand-made by ${CONFIG.name} with HTML, CSS & JavaScript ✿`;

/* voice blips */
let soundOn = true, audio;
function unlockAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
}
// browsers only allow sound after the visitor click, so unlocking on the first interaction.
["pointerdown", "keydown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once: true, passive: true }));
$("sound").setAttribute("aria-pressed", "true");
$("sound").textContent = "♪ Sound on";
$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound").setAttribute("aria-pressed", soundOn);
  $("sound").textContent = soundOn ? "♪ Sound on" : "♪ Sound off";
  if (soundOn) unlockAudio();
});
function blip() {
  if (!soundOn) return;
  try { unlockAudio(); } catch (e) { return; }
  if (audio.state !== "running") return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = "triangle";
  o.frequency.value = 420 + Math.random() * 280;
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + 0.08);
}

/* typing speech bubble */
const lines = CONFIG.dialogue.map(fill);
const guide = $("guide"), textEl = $("bubbleText"), nextEl = $("next");
let lineIdx = 0, charIdx = 0, typing = false, timer, mouthTimer;

function typeLine(n) {
  const text = lines[n];
  $("bubbleLive").textContent = text;
  nextEl.classList.remove("show");
  if (reduceMotion) { textEl.textContent = text; finish(); return; }
  textEl.textContent = ""; charIdx = 0; typing = true;
  mouthTimer = setInterval(() => guide.classList.toggle("talk-o"), 130);
  step();
}
function step() {
  const text = lines[lineIdx];
  if (charIdx >= text.length) return finish();
  const ch = text[charIdx++];
  textEl.textContent += ch;
  if (ch !== " " && charIdx % 2 === 0) blip();
  timer = setTimeout(step, /[.!?]/.test(ch) ? 260 : /[,]/.test(ch) ? 140 : 34);
}
function finish() {
  typing = false;
  clearTimeout(timer); clearInterval(mouthTimer);
  guide.classList.remove("talk-o");
  textEl.textContent = lines[lineIdx];
  if (lineIdx < lines.length - 1) nextEl.classList.add("show");
  else $("toMap").hidden = false;
}
$("bubble").addEventListener("click", () => {
  if (typing) return finish();
  if (lineIdx < lines.length - 1) { lineIdx++; typeLine(lineIdx); }
  else $("island").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
});
setTimeout(() => typeLine(0), reduceMotion ? 0 : 500);

/* popups  */
const R = {
  about: (s) => `${s.photo ? `<figure class="photo"><img src="${s.photo}" alt="Photo of ${CONFIG.name}" width="180" height="180"></figure>` : ""}<p class="lead">${s.intro}</p><ul class="facts">${s.facts.map(f => `<li>${f}</li>`).join("")}</ul>`,
  experience: (s) => s.items.map(e => `
    <div class="entry"><h3>${e.role}</h3><p class="meta">${e.org} · ${e.dates}</p>
    <ul>${e.points.map(p => `<li>${p}</li>`).join("")}</ul></div>`).join(""),
  projects: (s) => s.items.map(p => `
    <div class="entry"><h3>${p.name}</h3><p>${p.desc}</p>
    <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>
    ${p.link ? `<a class="pill-link" href="${p.link}" target="_blank" rel="noopener">Take a look →</a>` : ""}</div>`).join(""),
  skills: (s) => s.groups.map(g => `<h3 class="group">${g.label}</h3><div class="tags big">${g.items.map(i => `<span>${i}</span>`).join("")}</div>`).join(""),
  education: (s) => s.items.map(e => `
    <div class="entry"><h3>${e.school}</h3><p class="meta">${e.degree} · ${e.dates}</p>${e.note ? `<p>${e.note}</p>` : ""}</div>`).join(""),
  contact: (s) => `<p class="lead">${s.intro}</p><div class="links">${s.links.map(l => `
    <a class="contact-link" href="${l.href}" ${l.href.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}><span>${l.label}</span><strong>${l.value}</strong></a>`).join("")}</div>`
};

const modal = $("modal");
let lastFocus = null;
const visited = new Set();

function openSection(id, from) {
  const s = CONFIG.sections[id];
  lastFocus = from || document.activeElement;
  $("modalCard").style.setProperty("--c", s.color);
  $("modalTag").textContent = s.tag;
  $("modalTitle").textContent = s.place;
  $("modalBody").innerHTML = R[id](s);
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  $("modalCard").scrollTop = 0;
  $("modalClose").focus();
  markVisited(id);
}
function closeModal() {
  modal.hidden = true;
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
$("modalClose").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

document.querySelectorAll(".spot").forEach(el => {
  el.addEventListener("click", () => openSection(el.dataset.id, el));
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSection(el.dataset.id, el); }
  });
});

/* stamp rally  */
const stampRow = $("stampRow");
ORDER.forEach(id => {
  const s = CONFIG.sections[id];
  const b = document.createElement("button");
  b.className = "stamp"; b.type = "button"; b.dataset.id = id;
  b.style.setProperty("--c", s.color);
  b.textContent = s.tag;
  b.setAttribute("aria-label", `${s.tag} (not visited yet)`);
  b.addEventListener("click", () => openSection(id, b));
  stampRow.appendChild(b);
});
function markVisited(id) {
  if (visited.has(id)) return;
  visited.add(id);
  document.querySelector(`.spot[data-id="${id}"]`).classList.add("visited");
  const st = stampRow.querySelector(`[data-id="${id}"]`);
  st.classList.add("got");
  st.setAttribute("aria-label", `${CONFIG.sections[id].tag} (visited)`);
  if (visited.size === ORDER.length) {
    setTimeout(() => {
      $("toastText").textContent = `Wow, you visited every building on ${CONFIG.islandName}! Thanks for stopping by ✿`;
      $("toast").hidden = false;
      setTimeout(() => $("toast").hidden = true, 6000);
    }, 700);
  }
}

/* on phones, starting the map scrolled to the middle */
const ms = $("mapScroll");
requestAnimationFrame(() => { ms.scrollLeft = (ms.scrollWidth - ms.clientWidth) / 2; });
</script>
